<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="55%" stop-color="#2d1150"/>
      <stop offset="100%" stop-color="#3d0f42"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="50%" stop-color="#b04aff"/>
      <stop offset="100%" stop-color="#4ad9ff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6ae0"/>
      <stop offset="100%" stop-color="#7b3fe4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c04dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c04dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#150a26" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#150a26" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#150a26" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="980" cy="90" r="220" fill="url(#glow)"/>
  <circle cx="150" cy="320" r="160" fill="url(#glow)"/>

  <!-- Frequency grid lines -->
  <g stroke="#8a5fd6" stroke-opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
  </g>

  <!-- Right-side waveform spectrum bars -->
  <g opacity="0.9">
    <rect x="760" y="240" width="10" height="40" fill="url(#barGrad)" rx="2"/>
    <rect x="778" y="200" width="10" height="80" fill="url(#barGrad)" rx="2"/>
    <rect x="796" y="150" width="10" height="130" fill="url(#barGrad)" rx="2"/>
    <rect x="814" y="100" width="10" height="180" fill="url(#barGrad)" rx="2"/>
    <rect x="832" y="60" width="10" height="220" fill="url(#barGrad)" rx="2"/>
    <rect x="850" y="30" width="10" height="250" fill="url(#barGrad)" rx="2"/>
    <rect x="868" y="70" width="10" height="210" fill="url(#barGrad)" rx="2"/>
    <rect x="886" y="120" width="10" height="160" fill="url(#barGrad)" rx="2"/>
    <rect x="904" y="170" width="10" height="110" fill="url(#barGrad)" rx="2"/>
    <rect x="922" y="210" width="10" height="70" fill="url(#barGrad)" rx="2"/>
    <rect x="940" y="240" width="10" height="40" fill="url(#barGrad)" rx="2"/>
    <rect x="958" y="255" width="10" height="25" fill="url(#barGrad)" rx="2"/>
    <rect x="976" y="230" width="10" height="50" fill="url(#barGrad)" rx="2"/>
    <rect x="994" y="190" width="10" height="90" fill="url(#barGrad)" rx="2"/>
    <rect x="1012" y="140" width="10" height="140" fill="url(#barGrad)" rx="2"/>
    <rect x="1030" y="95" width="10" height="185" fill="url(#barGrad)" rx="2"/>
    <rect x="1048" y="130" width="10" height="150" fill="url(#barGrad)" rx="2"/>
    <rect x="1066" y="175" width="10" height="105" fill="url(#barGrad)" rx="2"/>
    <rect x="1084" y="215" width="10" height="65" fill="url(#barGrad)" rx="2"/>
    <rect x="1102" y="245" width="10" height="35" fill="url(#barGrad)" rx="2"/>
  </g>

  <!-- Flowing waveform line across the top -->
  <path d="M -20 55 Q 100 20, 220 55 T 460 55 Q 580 90, 700 55 T 940 55 Q 1060 20, 1220 55"
        fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.65"/>

  <!-- Secondary faint waveform -->
  <path d="M -20 300 Q 150 260, 300 300 T 600 300 Q 750 340, 900 300 T 1220 300"
        fill="none" stroke="#7b3fe4" stroke-width="2" opacity="0.35"/>

  <!-- Circular play / audio icon accent -->
  <g transform="translate(1080,290)">
    <circle r="34" fill="none" stroke="#ff6ae0" stroke-width="2" opacity="0.5"/>
    <path d="M -8 -14 L 14 0 L -8 14 Z" fill="#ff9be9" opacity="0.85"/>
  </g>

  <rect x="0" y="70" width="1200" height="150" fill="url(#panel)" opacity="0.4"/>

  <!-- Headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="58" fill="#f5eaff">
    <tspan x="60" y="150" textLength="1000" lengthAdjust="spacingAndGlyphs">Adobe Audition Full</tspan>
    <tspan x="60" y="220" textLength="720" lengthAdjust="spacingAndGlyphs">Version Download</tspan>
  </text>

  <!-- Tagline -->
  <text x="60" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#d8bfff" opacity="0.9">
    <tspan x="60" y="268" textLength="980" lengthAdjust="spacingAndGlyphs">Downloads Adobe Audition full version with built-in installer — single binary</tspan>
  </text>

  <!-- Accent underline -->
  <rect x="60" y="290" width="140" height="4" fill="url(#waveGrad)" rx="2"/>
</svg>